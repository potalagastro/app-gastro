<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#C05621"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Pota Gastro"/>
  <link rel="icon" href="/static/brand/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon-32.png"/>
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png"/>
  <link rel="manifest" href="/static/manifest.webmanifest"/>
  <title>Accedi — POTA LA GASTRO</title>
  <link rel="stylesheet" href="/static/app.css?v=20"/>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">
      <img class="brand-logo" src="/static/brand/logo.png" width="112" height="112" alt="Pota La Gastro"/>
      <h1>POTA LA GASTRO</h1>
      <p class="muted">Ordini &amp; Food Cost · Prevalle BS</p>
    </div>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="stack">
      <label>Utente
        <input type="text" name="username" autocomplete="username" required autofocus/>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required/>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Accedi</button>
    </form>
  </main>
</body>
</html>
